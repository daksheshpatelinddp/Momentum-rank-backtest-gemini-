name: 2. Momentum Strategy Backtest

on:
  workflow_run:
    workflows: ["1. NSE Bhavcopy Data Pipeline"]
    types: [completed]
  workflow_dispatch: # Allows manual trigger from mobile

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/python-version@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Execute Matrix Backtester
        run: python scripts/run_matrix_backtest.py

      - name: Commit Backtest Performance Reports
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add reports/
          git commit -m "Automated Strategy Backtest Report Update [skip ci]" || echo "No report changes"
          git push